      type: widget
      title: 监控实例
      zIndex: 3
      chartType: single
      valueConfig:
        name: 监控实例
        chartType: single
        dataSource: 监控中心总览统计::monitor/get_monitor_statistics
        selectedFields:
        - monitor_instance_total
        thresholdColors:
        - color: '#2563EB'
