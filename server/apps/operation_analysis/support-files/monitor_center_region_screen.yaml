# 监控中心总览。
# 顶部直接取监控统计。下方由使用者选择一个云区域和一条主机关联：
# 先查出该云区域的主机，再查出这些主机关联的资产，最后只统计这些资产的未恢复告警。
meta:
  schema_version: 1.2.0
  exported_at: '2026-11-15T00:00:00+08:00'
  source:
    organization_id: 0
  object_counts:
    dashboards: 0
    topologies: 0
    screens: 1
    reports: 0
    architectures: 0
    datasources: 0
    namespaces: 0
dashboards: []
topologies: []
architectures: []
reports: []
datasources: []
namespaces: []
screens:
- key: screen::监控中心总览_内置
  name: 监控中心总览
  desc: 顶部是监控实例、对象和插件的直接统计。下方先选择云区域和一条主机关联，再汇总该区域主机、关联资产和这些资产的未恢复告警。
  other: {}
  refresh_interval: 0
  view_sets:
    viewport:
      width: 1920
      height: 1080
      theme: screen-light
      background:
        type: color
        color: '#F3F6FB'
    decorations:
      title: 监控中心总览
      showClock: false
      showTitle: true
    filters:
    - id: cloud_region__string
      key: cloud_region
      name: 云区域
      type: string
      order: 0
      enabled: true
      inputConfig:
        control: select
        optionsSource:
          type: dynamic
          sourceRef:
            type: rest_api
            value: cmdb/get_cloud_region_options
          valueField: id
          labelField: name
    - id: model_asst__string
      key: model_asst
      name: 主机关联
      type: string
      order: 1
      enabled: true
      inputConfig:
        control: select
        optionsSource:
          type: dynamic
          sourceRef:
            type: rest_api
            value: cmdb/get_model_association_options
          valueField: model_asst_id
          labelField: label
          queryParams:
            model_id: host
    queryVariables:
    - id: region-hosts
      name: 云区域主机
      dataSource: CMDB 实例通用查询::cmdb/query_cmdb_instances
      valueField: inst_uuid
      params:
      - name: analysis_mode
        type: string
        value: detail
        alias_name: 分析方式
        filterType: fixed
      - name: model_id
        type: string
        value: host
        alias_name: 模型
        filterType: fixed
      - name: filters
        type: conditionFilter
        alias_name: 条件
        filterType: fixed
        value:
          logic: AND
          items:
          - field: cloud
            op: eq
            value:
              ref: cloud_region__string
    - id: related-assets
      name: 关联资产
      dataSource: CMDB 一跳关联通用查询::cmdb/query_cmdb_one_hop
      valueField: end_uuid
      params:
      - name: analysis_mode
        type: string
        value: detail
        alias_name: 分析方式
        filterType: fixed
      - name: start_model_id
        type: string
        value: host
        alias_name: 起点模型
        filterType: fixed
      - name: model_asst_id
        type: string
        alias_name: 关系
        filterType: fixed
        value:
          ref: model_asst__string
      - name: filters
        type: conditionFilter
        alias_name: 起点条件
        filterType: fixed
        value:
          logic: AND
          items:
          - field: inst_uuid
            op: in
            value:
              queryRef: region-hosts
    - id: monitored-assets
      name: 关联资产的监控实例
      dataSource: 监控实例通用查询::monitor/query_monitor_instances
      valueField: instance_id
      params:
      - name: analysis_mode
        type: string
        value: detail
        alias_name: 分析方式
        filterType: fixed
      - name: cmdb_ids
        type: string
        alias_name: CMDB 实例
        filterType: fixed
        inputConfig:
          control: select
          multiple: true
        value:
          queryRef: related-assets
    items:
    - h: 88
      w: 1920
      x: 0
      y: 0
      id: header-bar
      kind: shape
      shape: rect
      zIndex: 1
      shapeStyle:
        shadow: 0
        gradient: false
        hideBorder: true
        borderWidth: 0
        hideBackground: false
        backgroundColor: '#1E3A8A'
    - h: 48
      w: 720
      x: 36
      y: 12
      id: header-title
      kind: text
      zIndex: 2
      content: 监控中心总览
      textStyle:
        align: left
        color: '#FFFFFF'
        fontSize: 28
        fontWeight: 700
    - h: 28
      w: 900
      x: 36
      y: 52
      id: header-subtitle
      kind: text
      zIndex: 2
      content: 各云区域监控对象覆盖与活跃告警
      textStyle:
